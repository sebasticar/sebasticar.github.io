<!DOCTYPE html>
<html lang="hr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kviz: Obnovljivi izvori energije</title>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #000;
            color: #fff;
            font-family: Arial, sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .container {
            text-align: center;
            padding: 40px;
            max-width: 600px;
        }

        .icon {
            font-size: 5rem;
            color: #f39c12;
            margin-bottom: 20px;
        }

        h1 {
            font-size: 2.5rem;
            margin-bottom: 15px;
        }

        p {
            color: #bbb;
            font-size: 1.1rem;
            margin-bottom: 30px;
        }

        .btn {
            display: inline-block;
            background: #f39c12;
            color: #000;
            text-decoration: none;
            padding: 15px 30px;
            border-radius: 10px;
            font-size: 1.1rem;
            font-weight: bold;
            transition: 0.3s;
        }

        .btn:hover {
            background: #fff;
            transform: translateY(-3px);
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="icon">
            <i class="fas fa-question-circle"></i>
        </div>

        <h1>Obnovljivi izvori energije</h1>

        <p>
            Interaktivni kviz za provjeru znanja o obnovljivim izvorima energije.
        </p>

        <a href="quiz.html" class="btn">
            Započni kviz
        </a>
    </div>

</body>
</html>
